apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd

  annotations:
    # Zuerst ausrollen – bringt die CRDs, die der ClusterIssuer braucht.
    argocd.argoproj.io/sync-wave: "-2"

spec:
  project: default

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1

    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
        # Startup-Check-Job deaktivieren – blockiert unter ArgoCD unnoetig,
        # obwohl cert-manager selbst laeuft.
        startupapicheck:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Server-Side-Apply ist fuer die grossen cert-manager-CRDs zwingend,
      # sonst ueberschreiten sie das Annotation-Groessenlimit (client-side).
      - ServerSideApply=true
