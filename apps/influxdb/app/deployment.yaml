apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: influxdb

  template:
    metadata:
      labels:
        app: influxdb

    spec:
      containers:
        - name: influxdb
          # InfluxDB 1.x – kompatibel mit dem Proxmox Metric-Server-Typ "influxdb"
          image: influxdb:1.11
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8086
              name: http

          env:
            # Beim ersten Start automatisch die Datenbank "proxmox" anlegen.
            - name: INFLUXDB_DB
              value: "proxmox"
            # HTTP-Auth deaktiviert – InfluxDB ist nur im LAN per MetalLB-IP
            # erreichbar. Siehe README-Hinweis zu Auth, falls gewünscht.
            - name: INFLUXDB_HTTP_AUTH_ENABLED
              value: "false"

          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb

          readinessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 30

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: influxdb-data
