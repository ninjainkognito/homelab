apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
spec:
  replicas: 1

  selector:
    matchLabels:
      app: actual-budget

  template:
    metadata:
      labels:
        app: actual-budget

    spec:
      containers:
        - name: actual-budget
          image: actualbudget/actual-server:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5006

          volumeMounts:
            - name: data
              mountPath: /data

          readinessProbe:
            httpGet:
              path: /
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 30

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-budget-data
