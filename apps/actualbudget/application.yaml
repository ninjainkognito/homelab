apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actualbudget
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ninjainkognito/homelab
    targetRevision: HEAD
    path: apps/actualbudget/app

  destination:
    server: https://kubernetes.default.svc
    namespace: actual-budget

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
