# Admin-Passwort wird NICHT mehr im Klartext hier gesetzt.
# Es wird aus einem bestehenden Kubernetes-Secret gelesen (siehe README / kubectl-Kommando).
admin:
  enabled: true
  existingSecret: "pihole-admin-password"
  passwordKey: "password"

DNS1: "1.1.1.1"
DNS2: "9.9.9.9"

persistentVolumeClaim:
  enabled: true
  size: 2Gi

serviceDns:
  type: LoadBalancer

serviceWeb:
  type: LoadBalancer

# Lokale DNS-Records fuer die Ingress-Hostnamen (zeigen auf die ingress-nginx
# MetalLB-IP). Persistent ueber das Chart, ueberlebt Pod-Neustarts.
customDnsEntries:
  - address=/actual.homelab.lan/192.168.1.246
  - address=/grafana.homelab.lan/192.168.1.246
  - address=/pihole.homelab.lan/192.168.1.246
