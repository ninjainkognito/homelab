                "fieldConfig": {
                  "defaults": {
                    "unit": "percentunit",
                    "min": 0,
                    "max": 1,
                    "custom": {
                      "drawStyle": "line",
                      "fillOpacity": 15,
                      "lineWidth": 2
                    }
