                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "last",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi"
