                  "includeAll": false,
                  "label": "Node",
                  "multi": false,
                  "name": "node",
                  "options": [],
                  "query": "SHOW TAG VALUES FROM \"cpustat\" WITH KEY = \"host\" WHERE \"object\" = 'nodes'",
