# Grafana Helm Values
# Admin-Passwort wird NICHT im Klartext hier abgelegt, sondern aus einem
# bestehenden Kubernetes-Secret gelesen (siehe README).
admin:
  existingSecret: "grafana-admin-credentials"
  userKey: admin-user
  passwordKey: admin-password

# Persistenz fuer Dashboards/Einstellungen (nutzt local-path-provisioner als
# Default StorageClass).
persistence:
  enabled: true
  size: 5Gi

# Zugriff via MetalLB LoadBalancer (wie bei Pihole).
service:
  type: LoadBalancer
  port: 80

# Datenquellen:
#  - InfluxDB-Proxmox: Proxmox-Metriken (Push vom Proxmox Metric Server)
#  - Prometheus:       Cluster-/Namespace-Metriken (kube-prometheus-stack)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: InfluxDB-Proxmox
        type: influxdb
        access: proxy
        url: http://influxdb.influxdb.svc.cluster.local:8086
        database: proxmox
        isDefault: true
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        isDefault: false

# Dashboard-Provider: laedt JSON-Dashboards, die unten unter "dashboards"
# referenziert werden.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# Eingebettete Dashboards. Quelle der Wahrheit sind die JSON-Dateien unter
# apps/grafana/dashboards/ ; hier eingebettet fuer den File-Provider.
dashboards:
  default:
    proxmox-node:
      json: |
          {
            "annotations": {
              "list": [
                {
                  "builtIn": 1,
                  "datasource": "-- Grafana --",
                  "enable": true,
