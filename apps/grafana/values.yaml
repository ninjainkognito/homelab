# Grafana Helm Values
# Admin-Passwort wird NICHT im Klartext hier abgelegt, sondern aus einem
# bestehenden Kubernetes-Secret gelesen (siehe README).
admin:
  existingSecret: "grafana-admin-credentials"
  userKey: admin-user
  passwordKey: admin-password

# Persistenz fuer Dashboards/Einstellungen (nutzt local-path-provisioner als
# Default StorageClass).
persistence:
  enabled: true
  size: 5Gi

# Zugriff via MetalLB LoadBalancer (wie bei Pihole).
service:
  type: LoadBalancer
  port: 80

# InfluxDB (v1) als Datenquelle. Grafana erreicht InfluxDB cluster-intern per
# Kubernetes-DNS. Die Datenbank "proxmox" wird von InfluxDB beim Start angelegt
# und von Proxmox (Metric Server) befuellt.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: InfluxDB-Proxmox
        type: influxdb
        access: proxy
        url: http://influxdb.influxdb.svc.cluster.local:8086
        database: proxmox
        isDefault: true

# Dashboard-Provider: laedt JSON-Dashboards, die unten unter "dashboards"
# referenziert werden.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# Eigenes Proxmox-Node-Dashboard, zugeschnitten auf unsere Tag-Struktur
# (object=nodes, host=<node>). Quelle der Wahrheit:
# apps/grafana/dashboards/proxmox-node.json  (hier eingebettet fuer den
# File-Provider). Bei Aenderungen die JSON-Datei anpassen und neu einbetten.
dashboards:
  default:
    proxmox-node:
      json: |
          {
            "annotations": {
              "list": [
                {
                  "builtIn": 1,
                  "datasource": "-- Grafana --",
                  "enable": true,
                  "hide": true,
                  "iconColor": "rgba(0, 211, 255, 1)",
                  "name": "Annotations & Alerts",
                  "type": "dashboard"
                }
              ]
            },
            "editable": true,
            "fiscalYearStartMonth": 0,
            "graphTooltip": 1,
            "id": null,
            "links": [],
            "liveNow": false,
            "refresh": "30s",
            "schemaVersion": 39,
            "tags": [
              "proxmox",
              "homelab"
            ],
            "templating": {
              "list": [
                {
                  "current": {},
                  "datasource": "InfluxDB-Proxmox",
                  "definition": "SHOW TAG VALUES FROM \"cpustat\" WITH KEY = \"host\" WHERE \"object\" = 'nodes'",
                  "hide": 0,
                  "includeAll": false,
                  "label": "Node",
                  "multi": false,
                  "name": "node",
                  "options": [],
                  "query": "SHOW TAG VALUES FROM \"cpustat\" WITH KEY = \"host\" WHERE \"object\" = 'nodes'",
                  "refresh": 2,
                  "regex": "",
                  "sort": 1,
                  "type": "query"
                }
              ]
            },
            "time": {
              "from": "now-3h",
              "to": "now"
            },
            "timepicker": {},
            "timezone": "browser",
            "title": "Proxmox Node",
            "uid": "proxmox-node",
            "version": 2,
            "panels": [
              {
                "title": "CPU Usage",
                "type": "timeseries",
                "datasource": "InfluxDB-Proxmox",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 0
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percentunit",
                    "min": 0,
                    "max": 1,
                    "custom": {
                      "drawStyle": "line",
                      "fillOpacity": 15,
                      "lineWidth": 2
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "last",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT mean(\"cpu\") AS \"CPU\" FROM \"cpustat\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND $timeFilter GROUP BY time($__interval) fill(none)"
                  },
                  {
                    "refId": "B",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT mean(\"wait\") AS \"IO wait\" FROM \"cpustat\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND $timeFilter GROUP BY time($__interval) fill(none)"
                  }
                ]
              },
              {
                "title": "Load Average",
                "type": "timeseries",
                "datasource": "InfluxDB-Proxmox",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 0
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "short",
                    "min": 0,
                    "custom": {
                      "drawStyle": "line",
                      "fillOpacity": 10,
                      "lineWidth": 2
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "last"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT mean(\"avg1\") AS \"1m\", mean(\"avg5\") AS \"5m\", mean(\"avg15\") AS \"15m\" FROM \"cpustat\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND $timeFilter GROUP BY time($__interval) fill(none)"
                  }
                ]
              },
              {
                "title": "Memory",
                "type": "timeseries",
                "datasource": "InfluxDB-Proxmox",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 8
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes",
                    "min": 0,
                    "custom": {
                      "drawStyle": "line",
                      "fillOpacity": 15,
                      "lineWidth": 2
                    }
                  },
                  "overrides": [
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "total"
                      },
                      "properties": [
                        {
                          "id": "custom.fillOpacity",
                          "value": 0
                        },
                        {
                          "id": "custom.lineStyle",
                          "value": {
                            "dash": [
                              6,
                              6
                            ],
                            "fill": "dash"
                          }
                        }
                      ]
                    }
                  ]
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "last",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT mean(\"memused\") AS \"used\", mean(\"memtotal\") AS \"total\", mean(\"memfree\") AS \"free\" FROM \"memory\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND $timeFilter GROUP BY time($__interval) fill(none)"
                  }
                ]
              },
              {
                "title": "Swap / ARC",
                "type": "timeseries",
                "datasource": "InfluxDB-Proxmox",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 8
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes",
                    "min": 0,
                    "custom": {
                      "drawStyle": "line",
                      "fillOpacity": 10,
                      "lineWidth": 2
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "last",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT mean(\"swapused\") AS \"swap used\", mean(\"swaptotal\") AS \"swap total\", mean(\"arcsize\") AS \"ZFS ARC\" FROM \"memory\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND $timeFilter GROUP BY time($__interval) fill(none)"
                  }
                ]
              },
              {
                "title": "Network Traffic (nics)",
                "type": "timeseries",
                "datasource": "InfluxDB-Proxmox",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 16
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "Bps",
                    "min": 0,
                    "custom": {
                      "drawStyle": "line",
                      "fillOpacity": 15,
                      "lineWidth": 2
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "last",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT non_negative_derivative(mean(\"receive\"), 1s) AS \"rx\" FROM \"nics\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND (\"instance\" =~ /^(en|eth|vmbr)/) AND $timeFilter GROUP BY time($__interval), \"instance\" fill(none)"
                  },
                  {
                    "refId": "B",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT non_negative_derivative(mean(\"transmit\"), 1s) AS \"tx\" FROM \"nics\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND (\"instance\" =~ /^(en|eth|vmbr)/) AND $timeFilter GROUP BY time($__interval), \"instance\" fill(none)"
                  }
                ]
              },
              {
                "title": "Disk I/O (blockstat)",
                "type": "timeseries",
                "datasource": "InfluxDB-Proxmox",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 16
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "Bps",
                    "min": 0,
                    "custom": {
                      "drawStyle": "line",
                      "fillOpacity": 15,
                      "lineWidth": 2
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "last",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT non_negative_derivative(mean(\"rd_bytes\"), 1s) AS \"read\" FROM \"blockstat\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND $timeFilter GROUP BY time($__interval), \"instance\" fill(none)"
                  },
                  {
                    "refId": "B",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT non_negative_derivative(mean(\"wr_bytes\"), 1s) AS \"write\" FROM \"blockstat\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND $timeFilter GROUP BY time($__interval), \"instance\" fill(none)"
                  }
                ]
              },
              {
                "title": "Root FS Usage",
                "type": "timeseries",
                "datasource": "InfluxDB-Proxmox",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 0,
                  "y": 24
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes",
                    "min": 0,
                    "custom": {
                      "drawStyle": "line",
                      "fillOpacity": 15,
                      "lineWidth": 2
                    }
                  },
                  "overrides": [
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "total"
                      },
                      "properties": [
                        {
                          "id": "custom.fillOpacity",
                          "value": 0
                        },
                        {
                          "id": "custom.lineStyle",
                          "value": {
                            "dash": [
                              6,
                              6
                            ],
                            "fill": "dash"
                          }
                        }
                      ]
                    }
                  ]
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "bottom",
                    "calcs": [
                      "last",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT mean(\"used\") AS \"used\", mean(\"blocks\") AS \"total\" FROM \"blockstat\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND $timeFilter GROUP BY time($__interval) fill(none)"
                  }
                ]
              },
              {
                "title": "Uptime",
                "type": "stat",
                "datasource": "InfluxDB-Proxmox",
                "gridPos": {
                  "h": 8,
                  "w": 12,
                  "x": 12,
                  "y": 24
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "s",
                    "color": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "reduceOptions": {
                    "calcs": [
                      "lastNotNull"
                    ],
                    "fields": "",
                    "values": false
                  },
                  "textMode": "value",
                  "colorMode": "value",
                  "graphMode": "none"
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT last(\"uptime\") AS \"uptime\" FROM \"system\" WHERE \"object\" = 'nodes' AND \"host\" =~ /^$node$/ AND $timeFilter"
                  }
                ]
              },
              {
                "title": "VM / LXC CPU (alle Gäste)",
                "type": "timeseries",
                "datasource": "InfluxDB-Proxmox",
                "gridPos": {
                  "h": 9,
                  "w": 24,
                  "x": 0,
                  "y": 32
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percentunit",
                    "min": 0,
                    "custom": {
                      "drawStyle": "line",
                      "fillOpacity": 5,
                      "lineWidth": 1
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "right",
                    "calcs": [
                      "last",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT mean(\"cpu\") FROM \"system\" WHERE (\"object\" = 'qemu' OR \"object\" = 'lxc') AND \"status\" = 'running' AND $timeFilter GROUP BY time($__interval), \"vmid\" fill(none)"
                  }
                ]
              },
              {
                "title": "VM / LXC Memory (alle Gäste)",
                "type": "timeseries",
                "datasource": "InfluxDB-Proxmox",
                "gridPos": {
                  "h": 9,
                  "w": 24,
                  "x": 0,
                  "y": 41
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "bytes",
                    "min": 0,
                    "custom": {
                      "drawStyle": "line",
                      "fillOpacity": 5,
                      "lineWidth": 1
                    }
                  },
                  "overrides": []
                },
                "options": {
                  "legend": {
                    "displayMode": "table",
                    "placement": "right",
                    "calcs": [
                      "last",
                      "max"
                    ]
                  },
                  "tooltip": {
                    "mode": "multi",
                    "sort": "desc"
                  }
                },
                "targets": [
                  {
                    "refId": "A",
                    "datasource": "InfluxDB-Proxmox",
                    "rawQuery": true,
                    "resultFormat": "time_series",
                    "query": "SELECT mean(\"mem\") FROM \"system\" WHERE (\"object\" = 'qemu' OR \"object\" = 'lxc') AND \"status\" = 'running' AND $timeFilter GROUP BY time($__interval), \"vmid\" fill(none)"
                  }
                ]
              }
            ]
          }
