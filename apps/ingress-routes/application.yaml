apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-routes
  namespace: argocd

  annotations:
    # Nach cert-manager-issuer und ingress-nginx.
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: default

  source:
    repoURL: https://github.com/ninjainkognito/homelab
    targetRevision: HEAD
    path: apps/ingress-routes/manifests

  destination:
    server: https://kubernetes.default.svc
    # Namespace hier irrelevant – die Ingresse tragen eigene namespaces.
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
